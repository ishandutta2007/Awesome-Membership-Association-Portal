<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: transparent;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- CSS Keyframe Animations (Strictly in Background) -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(14px) translateX(-10px); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes waveDrift {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      .orb-1 { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseGlow 10s ease-in-out infinite alternate; transform-origin: 1000px 240px; }
      .bg-float-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .bg-float-2 { animation: floatSlow2 9s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 8 6; animation: dashFlow 20s linear infinite; }
      .wave-drift { animation: waveDrift 14s ease-in-out infinite; }
    </style>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- 2. Animated Ambient Glow Orbs (Layered Behind Content) -->
  <g class="orb-1">
    <circle cx="220" cy="110" r="160" fill="#38bdf8" opacity="0.18" filter="url(#glow-light)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="230" r="180" fill="#a855f7" opacity="0.18" filter="url(#glow-light)" />
  </g>

  <!-- 3. Dynamic Tech Wave Lines in Background -->
  <g class="wave-drift" opacity="0.25">
    <path class="flow-line" d="M -50 260 C 200 180, 450 320, 750 250 C 950 200, 1100 280, 1250 230" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M -50 290 C 250 220, 500 340, 800 280 C 1000 230, 1150 310, 1250 270" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- 4. Background Decorative Tech Floating Badges (Subtle, far left/right) -->
  <g class="bg-float-1" opacity="0.4">
    <rect x="70" y="55" width="130" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="90" cy="76" r="6" fill="#38bdf8" />
    <text x="105" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">MEMBERS</text>
  </g>

  <g class="bg-float-2" opacity="0.4">
    <rect x="1000" y="50" width="130" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="1020" cy="71" r="6" fill="#c084fc" />
    <text x="1035" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">PORTALS</text>
  </g>

  <!-- 5. Central Foreground Content Area (Guaranteed Foreground Clarity) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 58)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e293b" stroke="url(#primary-grad)" stroke-width="1.5" filter="url(#card-shadow)" />
    <circle cx="-135" cy="0" r="5" fill="#34d399" />
    <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f1f5f9" text-anchor="middle">
      CURATED ECOSYSTEM &amp; INDEX
    </text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(600, 135)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#primary-grad)" text-anchor="middle" filter="url(#card-shadow)">
      Membership &amp; Association Portal
    </text>
  </g>

  <!-- Subtitle Description -->
  <g transform="translate(600, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" text-anchor="middle">
      Comprehensive Directory of SaaS AMS Platforms &amp; Open-Source Community Portals
    </text>
  </g>

  <!-- Feature Pills / Highlights (Pill Badges) -->
  <g transform="translate(600, 255)">
    <!-- Pill 1: SaaS & AMS -->
    <g transform="translate(-320, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">☁️ Cloud AMS</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(-105, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle">💻 Open-Source</text>
    </g>

    <!-- Pill 3: Member Portals -->
    <g transform="translate(115, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">👥 Member Portals</text>
    </g>

    <!-- Pill 4: Dues & Events -->
    <g transform="translate(325, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f43f5e" text-anchor="middle">💳 Dues &amp; Events</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
