<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="340" viewBox="0 0 1200 340" style="background:0 0"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".3"/></linearGradient><linearGradient id="accent-purple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".3"/></linearGradient><filter id="glow-light" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="card-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".45" stdDeviation="12"/></filter><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}@keyframes floatSlow1{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-12px) translateX(8px)}}@keyframes floatSlow2{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(14px) translateX(-10px)}}@keyframes dashFlow{0%{stroke-dashoffset:120}}@keyframes waveDrift{0%{transform:translateX(0)}50%{transform:translateX(-40px)}}.orb-1{animation:pulseGlow 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-2{animation:pulseGlow 10s ease-in-out infinite alternate;transform-origin:1000px 240px}.bg-float-1{animation:floatSlow1 7s ease-in-out infinite}.bg-float-2{animation:floatSlow2 9s ease-in-out infinite}.flow-line{stroke-dasharray:8 6;animation:dashFlow 20s linear infinite}.wave-drift{animation:waveDrift 14s ease-in-out infinite}</style></defs><rect width="1200" height="340" fill="url(#bg-grad)" rx="16"/><g class="orb-1"><circle cx="220" cy="110" r="160" fill="#38bdf8" filter="url(#glow-light)" opacity=".18"/></g><g class="orb-2"><circle cx="980" cy="230" r="180" fill="#a855f7" filter="url(#glow-light)" opacity=".18"/></g><g class="wave-drift" opacity=".25"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 260 C 200 180, 450 320, 750 250 C 950 200, 1100 280, 1250 230" class="flow-line"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M -50 290 C 250 220, 500 340, 800 280 C 1000 230, 1150 310, 1250 270" class="flow-line"/></g><g class="bg-float-1" opacity=".4"><rect width="130" height="42" x="70" y="55" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" rx="21"/><circle cx="90" cy="76" r="6" fill="#38bdf8"/><text x="105" y="81" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">MEMBERS</text></g><g class="bg-float-2" opacity=".4"><rect width="130" height="42" x="1000" y="50" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" rx="21"/><circle cx="1020" cy="71" r="6" fill="#c084fc"/><text x="1035" y="76" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">PORTALS</text></g><g transform="translate(600, 58)"><rect width="320" height="32" x="-160" y="-16" fill="#1e293b" stroke="url(#primary-grad)" stroke-width="1.5" filter="url(#card-shadow)" rx="16"/><circle cx="-135" cy="0" r="5" fill="#34d399"/><text x="5" y="5" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED ECOSYSTEM &amp; IN